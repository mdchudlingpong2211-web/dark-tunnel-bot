services:
  - type: worker
    name: dark-tunnel-decryptor-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_USERNAME
        value: minarulsensi
      - key: CHANNEL_URL
        value: https://t.me/minarulsensi
      - key: LOG_LEVEL
        value: INFO
