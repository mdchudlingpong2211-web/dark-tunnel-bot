app = "dark-tunnel-decryptor-bot"
primary_region = "sin"

[build]

[processes]
  worker = "python main.py"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Set secrets before deploying:
#   fly secrets set API_ID=... API_HASH=... BOT_TOKEN=...
# Fly automatically restarts crashed VMs, giving a platform-level safety net
# on top of the process's own internal auto-restart loop.
